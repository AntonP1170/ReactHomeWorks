services:
  app:
    image: ghcr.io/antonp1170/reacthomeworks:latest
    container_name: reacthomeworks
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - web

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app
    networks:
      - web

  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DOCKER_API_VERSION: "1.44"
      WATCHTOWER_REGISTRY_USERNAME: ${GHCR_USER:-}
      WATCHTOWER_REGISTRY_PASSWORD: ${GHCR_TOKEN:-}
    command: --interval 30 --cleanup --stop-timeout 15s


networks:
  web:
